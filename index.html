<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OneTechSupport — Talk to Sora</title>
  <meta name="description" content="Chat or call Sora, the OneTechSupport AI Agent, for password resets, VPN troubleshooting, device health checks and IT/HR questions.">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <section class="demo-hero-bg">
    <div class="demo-hero-photo" aria-hidden="true"></div>
    <div class="hero-inner">

      <div id="heroContent">
        <div class="hero-badge">
          <span>24/7</span>&nbsp;·&nbsp;<span>English · Hinglish · Spanish · German</span>
        </div>

        <h1>How can <span class="accent">OneTechSupport</span> help you today?</h1>

        <p class="hero-sub">
          I'm Sora, your employee support specialist. I can run a device health check,
          fix your VPN, reset an app password, or answer an IT or HR question.
        </p>

        <button class="hero-input-fake" id="heroFakeInput" type="button" aria-label="Open chat with Sora">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Ask me things like <b>&ldquo;my VPN won&rsquo;t connect&rdquo;</b> or <b>&ldquo;reset my password&rdquo;</b></span>
        </button>

        <p class="hero-hint"><span class="dot"></span> Use the call or chat button to start</p>
      </div>

      <!-- Main stage — replaces the hero copy in place as metadata_notify events
           arrive during the conversation (chat or voice). Hidden until the first
           event lands; "← Home" returns to the hero without ending the session. -->
      <div id="stageWrap" class="stage-wrap" hidden aria-live="polite">
        <button type="button" id="stageHome" class="stage-home">&larr; Home</button>
        <div id="stageCard" class="stage-card"></div>
      </div>

    </div>
  </section>

  <!-- Floating contact dock — our own chat/call buttons, proxied to Cognigy's
       real (hidden) Webchat toggle and Click-to-Call button so we control
       the look without fighting the vendor widgets' own floating controls. -->
  <div class="contact-dock" id="contactDock">
    <button class="dock-btn dock-chat" id="dockChatBtn" type="button" aria-label="Chat with Sora">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <span class="dock-label">Contact Sora</span>
    <button class="dock-btn dock-call" id="dockCallBtn" type="button" aria-label="Call Sora">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 4h3l1.5 4-2 1.5a10 10 0 0 0 6 6l1.5-2 4 1.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 4 6.2 2 2 0 0 1 6 4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <script src="config.js"></script>
  <script src="live-session.js"></script>

  <!-- Webchat v3 -->
  <link rel="stylesheet" href="css/webchat.css">
  <script src="https://github.com/Cognigy/Webchat/releases/latest/download/webchat.js"></script>
  <script>
    initWebchat(window.DEMO_CONFIG.webchatConfigUrl, {
      settings: {
        colors: { primaryColor: window.DEMO_CONFIG.primaryColor },
        behavior: { enableTypingIndicator: true }
      }
    }).then(function (webchat) {
      window.webchat = webchat;
      webchat.registerAnalyticsService(function (event) {
        if (event.type === "webchat/incoming-message" && event.payload && event.payload.data) {
          window.LiveSession.handleRaw(event.payload.data);
        }
      });
    });

    // Auto-greeting: the flow always answers a session's first message with a
    // fixed "Hi, I'm Sora..." line regardless of what was sent, so the very
    // first time the employee opens the widget we silently send an empty
    // message to trigger it — no visible user bubble, no typing required.
    // Home Screen is disabled on this endpoint so opening goes straight to
    // the chat interface instead of a "Start conversation" gate.
    window.otsAutoGreet = function (attemptsLeft) {
      if (sessionStorage.getItem("otsAutoGreetSent")) return;
      if (!window.webchat || typeof window.webchat.sendMessage !== "function") {
        // The widget SDK (loaded from a GitHub release CDN) can still be
        // initializing when the dock button is clicked right after page
        // load — retry briefly instead of silently giving up, otherwise a
        // fast click or a slow connection means no greeting ever fires.
        if (attemptsLeft === undefined) attemptsLeft = 20; // ~5s at 250ms
        if (attemptsLeft <= 0) return;
        setTimeout(function () { window.otsAutoGreet(attemptsLeft - 1); }, 250);
        return;
      }
      sessionStorage.setItem("otsAutoGreetSent", "1");
      // Empty text + a non-empty data object slips past the widget's
      // "no text and no data" send guard while leaving text empty, so no
      // user bubble is rendered — the flow ignores the payload anyway and
      // always answers a session's first turn with the fixed greeting.
      window.webchat.sendMessage("", { ots_trigger: "greet_on_open" });
    };
  </script>

  <!-- Click-to-Call (WebRTC) -->
  <link rel="stylesheet" href="css/webrtc.css">
  <script src="https://github.com/Cognigy/click-to-call-widget/releases/latest/download/webRTCWidget.js"></script>
  <script>
    addEventListener("load", function () {
      if (window.initWebRTCWidget) {
        window.initWebRTCWidget(window.DEMO_CONFIG.webrtcConfigUrl).then(function (widget) {
          window.webrtcWidget = widget;

          function onNewSession(session) {
            session.on("newInfo", function (data) {
              var body = data && data.info && data.info.body;
              if (body) window.LiveSession.handleRaw(body);
            });
          }

          // widget.on(event, handler) forwards straight to the widget's
          // internal SIP user agent (see Cognigy/click-to-call-widget's
          // VoiceBotWidget.tsx: `userAgentRef.current?.on(event, handler)`),
          // and that user agent is only constructed once the endpoint's SIP
          // config has finished loading (a separate async fetch, inside
          // useSip()'s own effect). initWebRTCWidget's returned promise
          // resolves as soon as the widget component has *mounted*, which
          // can easily happen before that config fetch completes — so a
          // single widget.on("newRTCSession", ...) call right after that
          // promise resolves can silently attach to nothing (the optional
          // chaining swallows it, no error, no signal back to us) and no
          // voice metadata ever renders, on every call, not just sometimes.
          // There's no public "ready"/off() API to wait on instead, so
          // retry attaching for a few seconds — handleRaw below is
          // deduped, so a rare double-attach is harmless.
          var attempts = 0;
          (function attachNewSessionListener() {
            widget.on("newRTCSession", onNewSession);
            attempts++;
            if (attempts < 8) setTimeout(attachNewSessionListener, attempts < 4 ? 400 : 1000);
          })();
        });
      }
    });
  </script>

  <!-- The hero's fake input bar and the contact dock's buttons are not real
       widgets — they proxy clicks to Cognigy's own (visually hidden) webchat
       toggle and click-to-call button, so our custom UI stays in full control
       of layout while reusing the vendor widgets' real functionality. -->
  <script>
    function otsOpenWebchat() {
      var btn =
        document.getElementById("webchatWindowToggleButton") ||
        document.querySelector('button[data-cognigy-webchat-toggle="true"]') ||
        document.querySelector("button.webchat-toggle-button");
      if (btn) btn.click();
      if (window.otsAutoGreet) window.otsAutoGreet();
    }
    function otsStartCall() {
      var btn =
        document.querySelector(".webrtc_widget_call_button") ||
        document.querySelector(".webrtc_widget_content_logo");
      if (btn) btn.click();
    }
    document.getElementById("heroFakeInput").addEventListener("click", otsOpenWebchat);
    document.getElementById("dockChatBtn").addEventListener("click", otsOpenWebchat);
    document.getElementById("dockCallBtn").addEventListener("click", otsStartCall);
  </script>

</body>
</html>
